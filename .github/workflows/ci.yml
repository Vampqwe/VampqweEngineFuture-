name: constitution-theorem

# Merge-gate Теоремы синхронизации (docs/CONSTITUTION.md):
#   lint-rules exit 0  ∧  test exit 0  ⇒  код соответствует Конституции.
# Любой красный чек блокирует merge в main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theorem:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    name: PHP ${{ matrix.php }} — статика + тесты + doctor
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Autoload (vendor — только собственный PSR-4 генератор)
        run: composer dump-autoload --no-interaction

      - name: Статика Конституции (R1–R11)
        run: php bin/engine lint-rules

      - name: Поведение (Unit-тесты, включая KernelBoundaryTest T1–T3)
        run: php bin/engine test

      - name: Честная самодиагностика живого дерева
        run: php bin/engine doctor
